# Rules that make the Malva Dock behave like a dock on Hyprland.
# Add them to hyprland.conf. Hyprland's rule syntax has changed between versions; if a line is
# rejected, use the equivalent from the Hyprland wiki. The window title is "Malva Dock".
windowrulev2 = float, title:^(Malva Dock)$
windowrulev2 = pin, title:^(Malva Dock)$
windowrulev2 = nofocus, title:^(Malva Dock)$
windowrulev2 = noborder, title:^(Malva Dock)$
windowrulev2 = noshadow, title:^(Malva Dock)$
windowrulev2 = noblur, title:^(Malva Dock)$
windowrulev2 = noanim, title:^(Malva Dock)$
# Bottom centre of the monitor (adjust if your version does not accept these expressions):
windowrulev2 = move (monitor_w*0.5-window_w*0.5) (monitor_h-window_h), title:^(Malva Dock)$
