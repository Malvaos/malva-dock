# Malva Dock configuration.
#
# Copy this file to ~/.config/malva/dock.conf and edit it, or run `malva-dock --print-config`.
#
# Settings:
#   size           icon size in pixels (32 to 128)
#   magnification  size of the icon under the pointer compared with normal; 1.0 turns it off
#   theme          dark or light
#
# Each [Section] below is one icon, in order. [separator] draws a divider.
#   icon   a built-in name (apps files browser notes calculator fonts terminal keyboard
#          settings downloads trash) or the path to an SVG or PNG file
#   exec   shell command to run; "a || b" runs b when a is not installed
#   match  process names or window classes that mean "running", comma separated.
#          Leave it out to derive them from exec, or leave it empty to never show a dot.

size = 56
magnification = 1.7
theme = dark

[Apps]
icon = apps
exec = malva-launcher || wofi --show drun || rofi -show drun || fuzzel
match = malva-launcher, wofi, rofi, fuzzel

[Files]
icon = files
exec = malva-files || nautilus || thunar || dolphin || pcmanfm

[Browser]
icon = browser
exec = malva-browser || firefox || chromium || google-chrome-stable || brave

[Notes]
icon = notes
exec = malva-notes || gnome-text-editor || gedit || kate || mousepad

[Calculator]
icon = calculator
exec = malva-calculator || gnome-calculator || kcalc || galculator

[Fonts]
icon = fonts
exec = malva-fonts || gnome-font-viewer || font-manager

[Terminal]
icon = terminal
exec = malva-terminal || kitty || alacritty || foot || gnome-terminal || konsole || xterm

[Keyboard]
icon = keyboard
exec = osk || malva-osk

[Settings]
icon = settings
exec = malva-settings || gnome-control-center || systemsettings

[separator]

[Downloads]
icon = downloads
exec = xdg-open ~/Downloads
match =

[Trash]
icon = trash
exec = gio open trash:/// || xdg-open trash:///
match =
